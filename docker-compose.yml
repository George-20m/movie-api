name: movieapi

services:
  oracle:
    image: gvenzl/oracle-free:slim
    container_name: oracle-free
    env_file: .env
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  api:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      ConnectionStrings__Oracle: "User Id=${APP_USER};Password=${APP_USER_PASSWORD};Data Source=oracle:1521/FREEPDB1"
      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:5000"
      Kestrel__Endpoints__Grpc__Url: "http://0.0.0.0:5001"
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:5001:5001"
    restart: unless-stopped

volumes:
  oracle-data:
    external: true
